<section class="search-card">
  <h2 class="search-title">想找哪一款造景贴纸？</h2>
  <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()" class="search-form">
    <div class="query-row">
      <nz-form-item class="field-main">
        <nz-form-label nzRequired nzFor="targetName">名称</nz-form-label>
        <nz-form-control nzErrorTip="请输入名称">
          <nz-input-group [nzPrefix]="namePrefix" nzSize="large">
            <input
              id="targetName"
              nz-input
              formControlName="targetName"
              placeholder="例如：A系列 B贴纸"
              maxlength="200"
              autocomplete="off"
            />
          </nz-input-group>
          <ng-template #namePrefix>
            <span nz-icon nzType="search" class="input-icon"></span>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="seriesName">系列</nz-form-label>
        <nz-form-control nzErrorTip="系列名称过长">
          <input
            id="seriesName"
            nz-input
            nzSize="large"
            formControlName="seriesName"
            placeholder="例如：A系列"
            maxlength="200"
            autocomplete="off"
          />
        </nz-form-control>
      </nz-form-item>
    </div>

    <details class="more-options">
      <summary>更多选项</summary>
      <div class="more-grid">
        <nz-form-item>
          <nz-form-label nzFor="aliases">别名</nz-form-label>
          <nz-form-control>
            <input
              id="aliases"
              nz-input
              nzSize="large"
              formControlName="aliases"
              placeholder="逗号分隔"
              maxlength="2000"
              autocomplete="off"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzFor="seriesAliases">系列别名</nz-form-label>
          <nz-form-control>
            <input
              id="seriesAliases"
              nz-input
              nzSize="large"
              formControlName="seriesAliases"
              placeholder="逗号分隔"
              maxlength="2000"
              autocomplete="off"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzFor="brandNames">品牌 / 创作者</nz-form-label>
          <nz-form-control>
            <input
              id="brandNames"
              nz-input
              nzSize="large"
              formControlName="brandNames"
              placeholder="逗号分隔"
              maxlength="2000"
              autocomplete="off"
            />
          </nz-form-control>
        </nz-form-item>
      </div>
    </details>

    <div class="options-row">
      <div class="platform-picker">
        <label
          nz-checkbox
          class="platform-all"
          [nzChecked]="allSelected()"
          [nzIndeterminate]="selectionIndeterminate()"
          (nzCheckedChange)="toggleAll($event)"
        >
          全选
        </label>
        @for (platform of platforms; track platform) {
          <span
            class="platform-option"
            [class.platform-option--disabled]="!isConfigured(platform)"
            [title]="platformReason(platform)"
          >
            <label
              nz-checkbox
              [nzChecked]="isSelected(platform)"
              [nzDisabled]="!isConfigured(platform)"
              (nzCheckedChange)="togglePlatform(platform, $event)"
            >
              {{ platformLabel(platform) }}
            </label>
          </span>
        }
      </div>

      <label
        class="dropzone"
        [class.dropzone--active]="dragActive()"
        [class.dropzone--filled]="!!previewUrl()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <input
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif"
          (change)="onFileSelected($event)"
          [disabled]="uploading() || busy"
        />
        @if (previewUrl(); as preview) {
          <img class="dropzone__thumb" [src]="preview" alt="参考图片预览" />
          <span class="dropzone__name">{{ image()?.name }}</span>
          <button
            class="dropzone__remove"
            type="button"
            aria-label="移除参考图"
            (click)="removeImage(); $event.preventDefault()"
          >
            <span nz-icon nzType="close"></span>
          </button>
        } @else {
          <span
            nz-icon
            [nzType]="uploading() ? 'loading' : 'picture'"
            class="dropzone__icon"
          ></span>
          <span class="dropzone__text">{{ uploading() ? '上传中…' : '参考图：拖拽或 Ctrl+V' }}</span>
        }
      </label>

      <button
        nz-button
        nzType="primary"
        nzSize="large"
        type="submit"
        [nzLoading]="busy"
        [disabled]="uploading()"
        class="submit-button"
      >
        <span nz-icon nzType="search"></span>
        检索
      </button>
    </div>

    @if (uploadError()) {
      <nz-alert nzType="error" nzShowIcon [nzMessage]="uploadError()!" class="form-alert" />
    }
    @if (formError(); as formError) {
      <nz-alert nzType="error" nzShowIcon [nzMessage]="formError" class="form-alert" />
    }
  </form>
</section>
